<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Meower - Twitter for cats😺🐈</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1 class="title">Meower - Twitter for cats😺🐈</h1>
    </header>
    <main class="container">
        <form class="meow-form">
            <label for="name">Name:</label>
            <input class="u-full-width" type="text" id="name" name="name" />
            <label for="content">Meow:</label>
            <textarea class="u-full-width" type="text" id="content" name="content"></textarea>
            <button class="button-primary" type="submit">Send Your Meow😺</button>
        </form>
        <div class="meows-container">
            <div class="loading"><img alt="loading" src="loading.gif" /></div>
            <div class="meows"></div>
            <div class="loadcount">loaded <span id="loadcount">0</span> meows of <span id="totalcount">0</span></div>
            <div class="meowsloading"><img alt="loading" src="loading.gif" /></div>
            <div class="loadMore">load more...</div>
        </div>
    </main>
    <script src="client.js"></script>
</body>

</html>
